kern:
  kop: Van versnipperde data naar één helder proces
  blok1_titel: Hr en managers werken samen in één platform
  blok1_tekst: Gedaan met splitsen en consolideren van spreadsheets. Bye-bye versies en errors. Meer tijd voor kwaliteit.
  blok2_titel: Houd je loonkosten onder controle
  blok2_tekst: Zie meteen wat al is toegekend en hoeveel ruimte er nog is, per budget en in totaal. Stuur tijdig bij en voorkom overschrijdingen. Geen budget slippage meer.
  blok3_titel: Maak je loonbeleid consequent waar
  blok3_tekst: Help managers om consistente en eerlijkere loonbeslissingen te nemen. Met automatische suggesties volgens loonbanden, prestatiescores, budgetten en andere parameters. Wat jij verkiest.
  blok4_titel: Jouw loonbeleid, jouw manier van werken
  blok4_tekst: Youbo volgt jullie loonregels, formules en goedkeuringsflows. Jij bepaalt wie wat ziet. Verandert je loonbeleid? Dan verandert Youbo mee.
rondleiding:
  kop: Ontdek hoe Youbo werkt
  stappen:
    - titel: Managers beslissen onderbouwd
      tekst: Elke manager ziet zijn team, vergelijkt medewerkers en onderzoekt uitschieters. Hij neemt loonvoorstellen over of past ze aan binnen de afgesproken marges.
      scherm: vergelijken
    - titel: Finance volgt de budgetten
      tekst: Beheer de budgetten voor loonsverhoging, bonus en promoties afzonderlijk. Je ziet realtime de impact van elke beslissing. Geef directie en finance een helder overzicht op elk budget.
      scherm: budget
    - titel: Hr volgt de voortgang
      tekst: In een oogopslag zie je welke managers hun review al hebben afgerond en waar nog actie nodig is.
      scherm: overzicht
    - titel: Rewardletters in één klik
      tekst: Gepersonaliseerd en klaar om te versturen wanneer je wil. Geen mailmerge meer.
      scherm: rewardletter
  knop: Boek een demo
  nota: 'TODO — te bevestigen: de vier schermen zijn nagetekend met eigen, sluitende voorbeeldcijfers uit één demodataset, omdat het bestaande hero-scherm van youbo.io dezelfde medewerker op twee verschillende bedragen zet. Zodra er toegang is tot de app vervangen we ze door echte schermen met geanonimiseerde data'
cijfer:
  aanloop: De loonsverhogingen, bonussen en promoties van
  medewerkers: '19.000'
  midden: medewerkers in
  landen: '21'
  slot: landen worden al met Youbo beheerd
eu:
  kop: Wees klaar voor de EU Pay Transparency
  tekst: 'Start nu: ontdek loonverschillen en werk ze tijdig weg. Bewijs dat elke loonbeslissing consequent is. Genereer vlot de rapporten die Europa vraagt.'
integraties:
  kop: Plug vlot in met al je hr-tools
  tekst: Youbo past in elk hr-landschap en haalt zijn gegevens uit de systemen die je al gebruikt. Connecteer makkelijk met elke tool, van prestatiemanagement tot payroll.
  functie_1: Payroll
  functie_2: Tijdsregistratie
  functie_3: Performancemanagement
  functie_4: Core hr
faq:
  kop: Veelgestelde vragen
