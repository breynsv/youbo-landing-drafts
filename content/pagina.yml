kern:
  kop: Van versnipperde excels naar één helder proces
  blok1_titel: Hr en managers werken samen in één platform
  blok1_tekst: Gedaan met splitsen en consolideren van excels. Bye-bye versies en errors.
  blok2_titel: Automatische verdeelsuggesties, makkelijk én eerlijker
  blok2_tekst: Datagedreven volgens je loonbeleid, loonbanden, prestatiescores en andere parameters. Wat jij verkiest.
  blok3_titel: Realtime inzicht in budgetten
  blok3_tekst: Minder overschrijdingen. Meer controle, per budget en in totaal. Geen budget slippage meer.
rondleiding:
  kop: Ontdek hoe het werkt
  scrollhint: Scroll verder
  stappen:
    - titel: Hr houdt realtime het overzicht
      tekst: Zie wie klaar is en waar nog actie nodig is. Managers zien enkel hun team en hun data.
      scherm: overzicht
    - titel: Managers beslissen onderbouwd
      tekst: Volg het voorstel of wijk gemotiveerd af. Bekijk uitschieters, onderzoek individuele situaties of vergelijk medewerkers.
      scherm: vergelijken
    - titel: Elk budget blijft onder controle
      tekst: Zie meteen de impact van elke beslissing. Beheer het loonsverhoging-, bonus- en promotiebudget apart, en geef directie en finance een overzicht over het hele bedrijf.
      scherm: budget
    - titel: Rewardletters in één klik
      tekst: Gepersonaliseerd en klaar om te versturen wanneer je wil. Geen mailmerge meer.
      scherm: rewardletter
  knop: Boek een demo
  nota: 'TODO — te bevestigen: de vier schermen zijn nagetekend met eigen, sluitende voorbeeldcijfers uit één demodataset, omdat het bestaande hero-scherm van youbo.io dezelfde medewerker op twee verschillende bedragen zet. Zodra er toegang is tot de app vervangen we ze door echte schermen met geanonimiseerde data'
