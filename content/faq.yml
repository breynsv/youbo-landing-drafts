# Meer uitleg: content/LEESMIJ.txt. Het CMS herschrijft dit bestand bij elke opslag en bewaart geen ander commentaar dan deze regels.
items:
  - vraag: Hoe lang duurt het om Youbo op te zetten?
    antwoord: Van het eerste contact tot de eerste looncyclus duurt het gemiddeld drie maanden. De precieze doorlooptijd hangt af van je organisatie, je beschikbare loondata en je loonbeleid. Een developer begeleidt de inrichting, daarna werk je zelfstandig verder.
  - vraag: Vanaf hoeveel medewerkers is Youbo relevant?
    antwoord: Youbo wordt gebruikt door bedrijven vanaf 50 medewerkers. Het grootste rendement ontstaat doorgaans vanaf 300 medewerkers, of zodra het Excelproces complex en persoonsafhankelijk wordt.
  - vraag: Hoeveel kost het?
    antwoord: |-
      Dit is de vraag die iedereen stelt, en ze hoort op de pagina. Wat hier komt te staan, beslist Youbo zelf.
      TODO — te bevestigen: het antwoord op de prijsvraag. Jana loopt dit na met de partners en met Nicole. Een bereik of de logica achter de prijs is verdedigbaar, geen antwoord is dat niet
  - vraag: Past Youbo zich aan onze manier van werken aan?
    antwoord: Ja. Je loonbeleid, organisatiestructuur, goedkeuringsflows en marges vormen het uitgangspunt. Youbo neemt ook complexe regels en formules over.
  - vraag: Is Youbo geschikt voor meerdere landen en niveaus?
    antwoord: Ja. Je kunt budgetten fijnmazig verdelen over meerdere hiërarchische niveaus en Youbo inzetten in verschillende landen.
  - vraag: Hoe helpt Youbo met compliance?
    antwoord: Youbo past regels consequent toe, bewaakt afwijkingen en maakt elke loonbeslissing onderbouwd en traceerbaar.
