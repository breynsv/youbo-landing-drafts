items:
  - vraag: Hoe verloopt de opstart van Youbo?
    antwoord: Samen met een vaste contactpersoon stemmen we Youbo af op je loonbeleid, laden we je data in en leiden we je managers op. Tussen het eerste contact tot de eerste beloningsronde verloopt er gemiddeld 10 tot 12 weken, afhankelijk van de omvang van je organisatie en de complexiteit van je loonbeleid. Daarna kun je zelfstandig aan de slag. Je kan de configuratie aanpassen wanneer je loonbeleid verandert. Je vaste contactpersoon blijft beschikbaar voor ondersteuning. Tijdens de demo krijg je een concreet zicht op de timing voor jouw organisatie.
  - vraag: Is Youbo geschikt voor meerdere hiërarchische niveaus of meerdere landen?
    antwoord: Ja. Het budget kan fijnmazig worden opgesplitst over zoveel niveaus als gewenst. De tool is inzetbaar in meerdere landen, werkt met verschillende munteenheden en is beschikbaar in de meest courante talen.
  - vraag: Past Youbo zich aan onze manier van werken aan?
    antwoord: |-
      Youbo past zich aan jouw organisatie aan, niet andersom. Youbo neemt complexe regels en formules van jullie loonbeleid over. We vertrekken vanuit de vraag: hoe wil jullie organisatie haar loonbeleid uitvoeren? Vervolgens modelleren we de software volgens die behoefte.

      Jullie organisatiestructuur, loonregels, goedkeuringsflows en gewenste verantwoordelijkheden zijn het uitgangspunt. Mogen budgetten worden overschreden? Is het budget fixed of een percentage van de loonmassa? In welke mate kan een manager afwijken? Welke data kunnen de managers zien? Jij kiest, Youbo voert uit.
  - vraag: Hoe helpt Youbo met compliance en de regels rond loontransparantie?
    antwoord: Youbo past de regels consequent toe, bewaakt afwijkingen en maakt verschillen inzichtelijk en verantwoordbaar. Elke loonbeslissing met Youbo is overwogen, onderbouwd én traceerbaar. Daardoor helpt Youbo je om te beantwoorden aan de Europese loontransparantierichtlijn en bij rapportering en audits.
  - vraag: Ik gebruik SAP SuccessFactors of Workday al. Wat voegt Youbo toe?
    antwoord: Youbo sluit aan op je bestaande hr-tools, zoals SAP SuccessFactors of Workday. Die ondersteunen ook compensatiemanagement, maar Youbo is er specifiek voor ontwikkeld. Daardoor kun je je beloningsproces flexibeler inrichten en vlotter beheren. Youbo gebruikt de data uit je bestaande systemen en connecteert vlot met elke tool in je hr-landschap.
  - vraag: Wat kost Youbo?
    antwoord: De prijs hangt af van de omvang van je organisatie en de gewenste ondersteuning. Je betaalt een eenmalige opstartkost en een jaarlijkse licentie. Tijdens de demo bespreken we je behoeften en maken we een voorstel op maat.
