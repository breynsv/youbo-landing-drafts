# GEEN HTML in de tekst — de bouw weigert een bestand met een < erin, met opzet.
# Een alinea die met "TODO — " begint is een nota aan onszelf: ze krijgt op de pagina het gele kader en houdt die vraag uit de FAQ-structuurdata voor Google.
