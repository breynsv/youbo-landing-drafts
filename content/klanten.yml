# LET OP: een opslag in /beheer/ gaat rechtstreeks naar de live site; er kijkt niemand meer tussen.
# De cases en de quotes. Allebei een lijst: je mag er een bij zetten, een weghalen en de
# volgorde veranderen — cases minstens 2 en hoogstens 7, quotes minstens 3 en hoogstens 7.
# "bedrijf" is de naam achter het logo — die wordt voorgelezen in plaats van het beeld.
# "logo_hoogte" is de hoogte in beeldpunten; kijk ernaast en kies wat even zwaar weegt.
# "cijfers" is een opsomming: één regel per cijfer, twee of drie regels.
# "downloadlink" mag een anker (#cases-open) of een bestand zijn; een bestand dat niet bestaat stopt de bouw.
# GEEN HTML, en elk veld is één doorlopend stuk tekst. "TODO — " geeft het kader met de stippellijn.
# Meer uitleg: content/LEESMIJ.txt.
