# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.233.0/schema/sveltia-cms.json
#
# Sveltia CMS — de beheerkant van de hele landingspagina: content/pagina.yml,
# content/klanten.yml, content/contact.yml en content/faq.yml.
#
# ──────────────────────────────────────────────────────────────────────────────
# LEES DIT VOOR JE ER IETS AAN VERANDERT
#
# Dit bestand staat PUBLIEK online (GitHub Pages serveert deze repo
# rechtstreeks, en Cloudflare Pages ook). Er hoort dus geen geheim in. Het
# enige geheim van de aanmelding — de client secret van de GitHub-app — leeft
# in de omgevingsvariabelen van de Worker, niet hier. Sveltia zegt het zelf
# ook: "The config is publicly accessible, so don't put secrets in it."
#
# ELK VELD IS PLATTE TEKST. Geen markdown-veld, geen rich-text-veld, geen
# code-veld — nergens. Een rich-text-editor schrijft vroeg of laat een "<" in de
# inhoud, en de bouw weigert een inhoudsbestand met een "<" erin; dat is geen bug
# maar de beveiliging, want tekst uit een invulveld die als HTML op de pagina
# belandt is een lek. Vandaar ook de `pattern` op élk veld: die weigert een "<"
# en een regelafbreking al in de interface, in plaats van dat de publicatie een
# uur later faalt aan iets wat het invulvak net toestond.
#
# `widget: string` en niet `text`, óók voor de lange TODO-nota's. Elk veld op de
# pagina is één doorlopend stuk tekst — de opmaak heeft er geen plaats voor een
# tweede alinea — en de bouw weigert een regelafbreking. Een `text`-veld nodigt
# uit tot Enter, en dat is een val. De enige uitzondering is
# cases.kaart_N.cijfers: dat is een `list` van `string`, omdat het aantal cijfers
# per case echt verschilt. Het FAQ-antwoord onderaan is wél een `text`-veld, en
# dat is het enige: daar IS een nieuwe regel een nieuwe alinea.
#
# DE VELDVOLGORDE IS GEEN SMAAKKWESTIE. Sveltia schrijft bij elke opslag een
# volledig nieuw bestand, in de volgorde van `fields`. Wijkt die af van de
# volgorde in content/*.yml, dan is Jana's eerste opslag een herschrijving van
# het hele bestand waarin haar eigen wijziging niet te vinden is.
# toets-inhoud.mjs vergelijkt die twee volgordes en gaat rood zodra ze
# uiteenlopen — daar hoef je dus niet op te letten, maar wel op te vertrouwen.
#
# OM DEZELFDE REDEN KAN EEN VELD HIER NIET WEGGELATEN WORDEN. Wat niet in
# `fields` staat, verdwijnt bij de eerste opslag uit het bestand, en dan stopt de
# bouw omdat de pagina erom vraagt. Zo is de cookiebalk en de privacyregel niet
# "uit het CMS gehaald" maar uit content/contact.yml én uit de HTML gehaald; ze
# staan nu hard in de pagina, met een nota erbij. Zie BEHEER-VOLLEDIG.md.
#
# Het CMS herschrijft die bestanden met een echte YAML-schrijver, dus is
# commentaar dat erin stond daarna weg. Daarom staat de uitleg op drie plekken
# die het wél overleven: `hint` (wat Jana onder het invulvak ziet), `comment`
# hieronder (die regels schrijft het CMS zelf terug boven het bovenste veld van
# elk bestand) en content/LEESMIJ.txt (de achtergrond, die geen CMS aanraakt).
# Zie SVELTIA.md.
# ──────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: breynsv/youbo-landing-drafts
  branch: main

  # De Worker "sveltia-cms-auth" — het aanmeldstation. Hij draait (nagemeten op
  # 2026-10-09: /auth antwoordt 200 en laat alleen youbo-drafts.pages.dev toe).
  #
  # Dit is geen keuze maar de enige weg: Sveltia kent voor GitHub exact twee
  # aanmeldwegen, `oauth` en `token`. Aanmelden met een persoonlijk jeton is
  # niets voor een marketeer, en de PKCE-weg (waarmee een client secret
  # helemaal niet meer nodig zou zijn) staat in de broncode van Sveltia
  # 0.233.0 als "not yet supported due to GitHub's limitations". Dus: een eigen
  # OAuth-tussenstation, en Cloudflare Workers is daarvoor de kortste weg —
  # dezelfde Cloudflare-account die deze site al publiceert.
  #
  # De GitHub-sleutels van die Worker staan er nog niet in, dus werkt de knop
  # "Aanmelden met GitHub" pas zodra Sven de GitHub-app aangemaakt heeft. Tot
  # dan is de jeton-knop de enige die werkt, en daarom staat die er nog.
  base_url: https://youbo-cms-auth.sven-breynaert.workers.dev

  # Beide wegen staan open tot de Worker er is. Daarna mag `token` eruit, zodat
  # er maar één manier van aanmelden bestaat: auth_methods: [oauth]
  auth_methods: [oauth, token]

  # Deze repo is publiek, en dan is "public_repo" genoeg om erin te schrijven.
  # Standaard vraagt Sveltia "repo", en dat geeft de aanmelding schrijfrecht op
  # élke repository waar die persoon bij kan — ook de privé-repo's van een
  # klant. Wat hier staat, vraagt GitHub dus om het kleinste recht dat werkt.
  # Sveltia voegt er zelf ",user" aan toe om de naam van de aangemelde persoon
  # te kunnen tonen. Wordt deze repo ooit privé, dan moet hier "repo" staan.
  auth_scope: public_repo

  # Nederlands in de geschiedenis van de repo, en zichtbaar waar het over gaat.
  commit_messages:
    create: 'Inhoud toegevoegd via /beheer/: {{collection}} ({{path}})'
    update: 'Inhoud bijgewerkt via /beheer/: {{collection}} ({{path}})'
    delete: 'Inhoud verwijderd via /beheer/: {{collection}} ({{path}})'
    uploadMedia: 'Beeld toegevoegd via /beheer/: {{path}}'
    deleteMedia: 'Beeld verwijderd via /beheer/: {{path}}'

# Waar "de site bekijken" naar wijst. Bewust de pages.dev-site en niet GitHub
# Pages: alleen daar draait het build command dat de FAQ uit dit bestand in de
# pagina zet. Zie SVELTIA.md, "wat er na een opslag gebeurt".
site_url: https://youbo-drafts.pages.dev
display_url: https://youbo-drafts.pages.dev/draft-r3-01-definitief.html
app_title: Youbo — beheer

# Sveltia eist een media_folder, ook als geen enkel veld een beeld is (zonder
# die sleutel weigert het de configuratie). Hij wijst daarom naar een eigen,
# lege map en niet naar assets/img: dan staat de beeldbibliotheek van de echte
# site niet open voor een vergissing.
media_folder: content/media
public_folder: /content/media

# ── WAT ER MET EEN UPLOAD GEBEURT ───────────────────────────────────────────
#
# Sveltia bewerkt een beeld bij het uploaden, in de browser, vóór het naar
# GitHub gaat. Dat is hier geen luxe maar de hele reden dat Jana zelf een foto
# mag zetten: zonder deze blok landt haar telefoonfoto van 4 MB op de
# landingspagina. De site van deze klant draagt vandaag een PNG van 1 MB op een
# nieuwspagina; die fout maken wij niet.
#
# Nagekeken in de broncode van precies de versie die /beheer/ laadt
# (@sveltia/cms@0.233.0), niet uit het hoofd:
#
# · De sleutel is `media_libraries.default.config.transformations`. Er bestaat
#   ook `media_libraries.all.transformations`, en dat is NIET hetzelfde: `all`
#   geldt ook voor een externe beeldbibliotheek (Cloudinary en dergelijke),
#   `default.config` alleen voor de git-bibliotheek. Wij hebben de
#   git-bibliotheek — er staat geen enkele externe dienst in deze configuratie —
#   dus staat het onder `default.config`, waar het niet meer kan doen dan het
#   hier moet doen. (`media_libraries.default.transformations`, zonder `config`,
#   bestaat niet en wordt stil genegeerd.)
# · `raster_image` is de verzamelnaam voor elk rasterbeeld; `svg` staat
#   ernaast en kent alleen `optimize`.
# · `format` kan alleen `webp`. `quality` is een geheel getal 0-100,
#   standaard 85.
# · `width` en `height` zijn een BOVENGRENS met behoud van de verhouding, en
#   nooit opschalen (`fit: scale-down` in hun eigen code). Een beeld dat al
#   kleiner is, blijft zoals het is.
#
# DE MAAT KOMT UIT WAT DE PAGINA WERKELIJK TOONT, niet uit een rond getal.
# Gemeten in een eigen headless Chromium: de portretten bij de quotes staan op
# 56 beeldpunten, de ronde foto bij het formulier op 96, en het hoogste logo op
# 32. Drie keer zo groot is genoeg voor het scherpste scherm dat vandaag
# bestaat, dus staat de grens per veld op 168, 288 en 96 — zie de nota bij elk
# beeldveld. Deze algemene waarde is het net ruimere vangnet: 320 bij 320 is
# precies de maat van de vijf portretten die de klant al aanleverde.
#
# Wat Jana uploadt komt in content/media/ en dus PUBLIEK op de site te staan.
# Dat staat ook in beheer/LEESMIJ-JANA.md.
#
# De gemelde fout waarbij een .jfif-upload als "naam.jfifwebp" werd opgeslagen
# (sveltia-cms#963) is in 0.233.0 OPGELOST: commit 908d3ed4a zit vóór deze tag,
# en de extensielijst in deze bouw kent jfif, jpe, heif en de rest. Wij hoeven
# de bestandstypen dus niet te beperken, en dat is nagekeken in de bouw zelf en
# niet uit een changelog overgenomen.
media_libraries:
  default:
    config:
      # Vijftien megabyte. Ruim, met opzet: de omzetting hierboven maakt er toch
      # een kleine WebP van, en een grens die een gewone cameraopname weigert is
      # een grens waar Jana op vastloopt zonder te weten waarom.
      max_file_size: 15728640
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 320
          height: 320
        svg:
          optimize: true

# Een leeg veld dat niet verplicht is, laat Sveltia dan wég uit het bestand in
# plaats van er een lege waarde in te schrijven. Dat is nodig voor de nota op
# een casekaart: de bouw weigert een leeg veld (een leeg veld laat een gat op de
# pagina), en "geen nota" en "een nota die leeg is" moeten dus twee verschillende
# dingen zijn in het bestand. Standaard staat dit af.
output:
  omit_empty_optional_fields: true

collections:
  # TWEE NIVEAUS, TWEE NAMEN.
  #
  # Links in de zijbalk staat de verzameling, in het middenpaneel het bestand.
  # Tot 2026-10-09 heetten ze allebei "Veelgestelde vragen", en dan leest het
  # middenpaneel als een lege of kapotte lijst terwijl je gewoon moet
  # doorklikken. Nu zegt elk niveau waar je bent: de zijbalk zegt WAAR de tekst
  # staat (op de landingspagina), het middenpaneel zegt WAT je bewerkt.
  #
  # Dat tussenniveau helemaal overslaan kan Sveltia 0.233.0 niet. Nagemeten met
  # de echte beheerpagina in een browser: met `singletons` (hun eigen vorm voor
  # losse bestanden) verschijnt er een zijbalkpositie die rechtstreeks naar het
  # formulier gaat — maar alléén wanneer er daarnaast ook nog verzamelingen
  # zijn. Met één verzameling valt Sveltia terug op één positie die "Bestanden"
  # heet, een naam uit hun eigen taalbestand die wij niet kunnen veranderen, en
  # daarachter staat precies dezelfde tussenlijst. Dat is dus niet korter maar
  # wél onduidelijker. Een rechtstreekse link naar het formulier overleeft de
  # aanmelding niet (Sveltia springt na het inloggen zelf naar de verzameling).
  #
  # Sinds 2026-10-09 is het middenpaneel geen tussenstap meer maar een echte
  # keuze: vier bestanden, en Jana moet weten welk ze nodig heeft. De indeling
  # komt uit INHOUD-BEWERKBAAR.md en is gekozen op de vraag "waar gaat ze
  # kijken als ze iets wil aanpassen", niet op hoe de pagina gebouwd is. De
  # volgorde hieronder is de volgorde op de pagina.
  - name: landingspagina
    label: Landingspagina
    icon: article
    files:
      - name: pagina
        label: De tekst van de pagina
        icon: article
        file: content/pagina.yml
        editor:
          preview: true
        fields:
          - name: 'hero'
            label: 'Bovenaan de pagina'
            comment: |-
              LET OP: een opslag in /beheer/ gaat rechtstreeks naar de live site; er kijkt niemand meer tussen.
              Dit bestand is de TEKST van de landingspagina: de koppen, de lopende tekst en de knoplabels.
              Elk veld is één doorlopend stuk tekst — geen tweede alinea en geen regelafbreking.
              GEEN HTML: de bouw weigert een bestand met een < erin, met opzet.
              Een veld dat begint met "TODO — " krijgt op de pagina een apart kader met een stippellijn.
              De volgorde hier is de volgorde op de pagina.
              De logo's in de balk en de stappen van de rondleiding zijn lijsten: daar kan er een bij
              of af. Logo's: minstens 6, hoogstens 9. Stappen: hoogstens 4, want er zijn vier schermen.
              De groep "vindbaarheid" onderaan staat niet op de pagina: dat is Google en het deelbericht.
              Meer uitleg: content/LEESMIJ.txt.
            widget: 'object'
            collapsed: true
            fields:
              - name: 'kop'
                label: 'Grote kop'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'intro'
                label: 'Tekst onder de kop'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'knop'
                label: 'Knop'
                widget: 'string'
                required: true
                hint: 'Wat er op de knop staat. Kort houden: op een telefoon is dit de hele breedte.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'foto_alt'
                label: 'Beschrijving van de foto'
                widget: 'string'
                required: true
                hint: 'Wordt voorgelezen in plaats van het beeld, en staat er als het beeld niet laadt. Beschrijf wat erop staat.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'fototekst'
                label: 'Tekst naast de foto'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
          - name: 'logobalk'
            label: 'De balk met klantenlogo’s'
            widget: 'object'
            collapsed: true
            fields:
              - name: 'kop'
                label: 'Kop boven de logo’s'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'logos'
                label: 'De logo’s in de balk'
                label_singular: 'logo'
                widget: 'list'
                min: 6
                max: 9
                collapsed: true
                minimize_collapsed: true
                allow_reorder: true
                summary: '{{fields.naam}} · {{fields.hoogte}} px'
                hint: 'Minstens 6 en hoogstens 9. Onder 6 past een complete reeks in de balk en staat er een naam twee keer in beeld; boven 9 breekt de stilstaande versie van de rij in twee halve regels. Allebei gemeten. Het tempo van de balk rekent zichzelf uit op het aantal.'
                fields:
                  - name: 'naam'
                    label: 'Naam van het bedrijf'
                    widget: 'string'
                    required: true
                    hint: 'Wordt voorgelezen in plaats van het logo. Hij staat niet als tekst op de pagina.'
                    pattern:
                      - '^[^<\n]*$'
                      - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
                  - name: 'beeld'
                    label: 'Het logobestand'
                    widget: 'image'
                    required: true
                    hint: 'Het logobestand. Een PNG of JPG wordt bij het uploaden zelf omgezet naar WebP en verkleind; een SVG wordt opgeschoond. Bestaat het bestand niet, dan stopt de publicatie.'
                    # Een logo staat hoogstens op 32 beeldpunten hoog, dus is 96 drie keer zo veel. De breedte van 320 is ruim voor het breedste woordmerk (Mourik, 96 bp op de pagina).
                    media_libraries:
                      default:
                        config:
                          transformations:
                            raster_image:
                              format: webp
                              quality: 82
                              width: 320
                              height: 96
                            svg:
                              optimize: true
                  - name: 'hoogte'
                    label: 'Hoogte in beeldpunten'
                    widget: 'number'
                    required: true
                    hint: 'De hoogte in beeldpunten waarop dit logo staat. Kijk in het voorbeeld naar de buren en kies wat even zwaar weegt: een breed woordmerk mag hoger dan een rond teken. Buiten dit bereik stopt de bouw.'
                    value_type: 'int'
                    min: 16
                    max: 32
          - name: 'kern'
            label: 'De drie kernblokken'
            widget: 'object'
            collapsed: true
            fields:
              - name: 'kop'
                label: 'Kop van het blok'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'blok1_titel'
                label: 'Blok 1 — titel'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'blok1_tekst'
                label: 'Blok 1 — tekst'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'blok2_titel'
                label: 'Blok 2 — titel'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'blok2_tekst'
                label: 'Blok 2 — tekst'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'blok3_titel'
                label: 'Blok 3 — titel'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'blok3_tekst'
                label: 'Blok 3 — tekst'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
          - name: 'rondleiding'
            label: 'De rondleiding door het product'
            widget: 'object'
            collapsed: true
            fields:
              - name: 'kop'
                label: 'Kop van het blok'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'scrollhint'
                label: 'Het zinnetje “Scroll verder”'
                widget: 'string'
                required: true
                hint: 'Staat alleen op desktop, onderaan de eerste stap.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'stappen'
                label: 'De stappen van de rondleiding'
                label_singular: 'stap'
                widget: 'list'
                min: 2
                max: 4
                collapsed: true
                minimize_collapsed: true
                allow_reorder: true
                allow_add: false
                summary: '{{fields.titel}}'
                hint: 'Hoogstens 4, en er kan er geen bij: elke stap hoort bij één nagetekend scherm en die vier zijn getekend. Een stap weglaten of de volgorde omgooien kan wel — het scherm gaat mee. Minstens 2, want met één stap wisselt het beeld nooit.'
                fields:
                  - name: 'titel'
                    label: 'Titel van de stap'
                    widget: 'string'
                    required: true
                    hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel. Deze titel wordt ook voorgelezen bij de springknop links van het scherm.'
                    pattern:
                      - '^[^<\n]*$'
                      - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
                  - name: 'tekst'
                    label: 'Tekst van de stap'
                    widget: 'string'
                    required: true
                    hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                    pattern:
                      - '^[^<\n]*$'
                      - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
                  - name: 'scherm'
                    label: 'Welk scherm hiernaast'
                    widget: 'select'
                    required: true
                    hint: 'De tekening die bij deze stap hoort. Vier bestaan er, en elk mag maar bij één stap staan: hun cijfers sluiten op elkaar aan. Een vijfde laten tekenen is werk voor een ontwikkelaar.'
                    options:
                      - { label: 'Cyclusoverzicht voor hr', value: 'overzicht' }
                      - { label: 'Medewerkers vergelijken', value: 'vergelijken' }
                      - { label: 'Budget per soort', value: 'budget' }
                      - { label: 'Loonpakket oud, nieuw en verschil', value: 'rewardletter' }
              - name: 'knop'
                label: 'Knop onder de rondleiding'
                widget: 'string'
                required: true
                hint: 'Wat er op de knop staat. Kort houden: op een telefoon is dit de hele breedte.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'nota'
                label: 'Open punt'
                widget: 'string'
                required: true
                hint: 'Een open punt. Begin met "TODO — " en zet een dubbele punt na wie het moet antwoorden; dan krijgt het op de pagina het kader met de stippellijn. Haal het weg zodra het antwoord er is.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
          - name: 'cijfer'
            label: 'Het grote cijfer'
            widget: 'object'
            collapsed: true
            fields:
              - name: 'aanloop'
                label: 'De zin ervóór'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
