      # De FAQ. Het enige bestand met een `text`-veld, en het enige waar een
      # nieuwe regel een nieuwe alinea is — zie de kop van dit bestand.
      - name: faq
        label: Veelgestelde vragen
        icon: quiz
        file: content/faq.yml
        # `description` stond hier en is weg: Sveltia kent die sleutel niet en
        # schreef bij elke keer openen een waarschuwing in de console. Wat
        # erin stond — dat opslaan meteen publiceert — staat nu in de hint
        # hieronder, waar Jana het werkelijk ziet.
        #
        # HET VOORBEELDVENSTER STAAT AAN, en toont niet de losse velden maar het
        # echte blok van de pagina: dezelfde Tailwind-tokens, hetzelfde
        # lettertype, hetzelfde open- en dichtklappen, hetzelfde TODO-kader. Het
        # is letterlijk uit draft-r3-01-definitief.html geknipt en met
        # faq-opmaak.js en inhoud-opmaak.js gevuld — dezelfde bestanden waarmee
        # de bouw de pagina maakt. Zie beheer/voorbeeld.js.
        editor:
          preview: true
        fields:
          - name: items
            label: Vragen
            label_singular: Vraag
            widget: list
            min: 1
            summary: '{{fields.vraag}}'
            collapsed: true
            hint: >-
              **Opslaan zet je tekst rechtstreeks op de site** — er kijkt
              niemand meer mee. Een paar minuten later staat ze er.\nSleep om de
              volgorde te veranderen — de volgorde hier is de volgorde op de
              pagina. Verwijder je een vraag, dan verdwijnt ze van de pagina.
            # Deze regels schrijft Sveltia terug boven `items:` in het bestand,
            # bij elke opslag. Het is de enige uitleg die een herschrijving
            # overleeft, dus staat hier het nodige en niet alles. Een letterlijk
            # blok (|-), zodat elke regel hier één regel commentaar wordt.
            comment: |-
              LET OP: een opslag in /beheer/ gaat rechtstreeks naar de live site; er kijkt niemand meer tussen.
              Deze vragen worden beheerd op /beheer/ en horen bij draft-r3-01-definitief.html.
              Dit bestand is de bron: build-faq.mjs zet de tekst bij de bouw in die pagina.
              Verander dus hier de tekst en niet in de HTML.
              GEEN HTML in de tekst — de bouw weigert een bestand met een < erin, met opzet.
              Een alinea die met "TODO — " begint is een nota aan onszelf: ze krijgt op de pagina een apart kader met een stippellijn en houdt die vraag uit de FAQ-structuurdata voor Google.
              De volgorde hier is de volgorde op de pagina.
              Meer uitleg: content/LEESMIJ.txt. Het CMS herschrijft dit bestand bij elke opslag en bewaart geen ander commentaar dan deze regels.
            fields:
              - name: vraag
                label: Vraag
                widget: string
                required: true
                hint: >-
                  Eén regel, zoals een bezoeker ze zelf zou stellen. Geen
                  opmaak.
                pattern:
                  - '^[^<]*$'
                  - 'Het teken < mag hier niet staan: de pagina bouwt dan niet.'
              - name: antwoord
                label: Antwoord
                widget: text
                required: true
                use_emoji_autocomplete: false
                hint: >-
                  Gewone tekst, geen opmaak en geen HTML — geen **vet**, geen
                  links. **Een nieuwe regel begint een nieuwe alinea** op de
                  pagina.\nStaat het antwoord nog niet vast? Begin de regel met
                  `TODO — `: die alinea komt dan in een apart kader te staan (je
                  ziet het meteen in het voorbeeld hiernaast) en
                  de vraag blijft uit de zoekresultaten van Google tot het
                  echte antwoord er is.
                pattern:
                  - '^[^<]*$'
                  - 'Het teken < mag hier niet staan: de pagina bouwt dan niet.'
