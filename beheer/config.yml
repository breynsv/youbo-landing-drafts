      - name: klanten
        label: Cases en quotes
        icon: reviews
        file: content/klanten.yml
        editor:
          preview: true
        fields:
          - name: 'cases'
            label: 'De cases'
            comment: |-
              LET OP: een opslag in /beheer/ gaat rechtstreeks naar de live site; er kijkt niemand meer tussen.
              De cases en de quotes. Allebei een lijst: je mag er een bij zetten, een weghalen en de
              volgorde veranderen — cases minstens 2 en hoogstens 7, quotes minstens 3 en hoogstens 7.
              "bedrijf" is de naam achter het logo — die wordt voorgelezen in plaats van het beeld.
              "logo_hoogte" is de hoogte in beeldpunten; kijk ernaast en kies wat even zwaar weegt.
              "cijfers" is een opsomming: één regel per cijfer, twee of drie regels.
              "gebruik" staat klein boven die cijfers, op elke kaart dezelfde — het zegt waar ze over gaan.
              "downloadlink" mag een anker (#cases-open) of een bestand zijn; een bestand dat niet bestaat stopt de bouw.
              GEEN HTML, en elk veld is één doorlopend stuk tekst. "TODO — " geeft het kader met de stippellijn.
              Meer uitleg: content/LEESMIJ.txt.
            widget: 'object'
            collapsed: true
            fields:
              - name: 'gebruik'
                label: 'De zinsnede boven de cijfers'
                widget: 'string'
                required: true
                hint: 'Dezelfde zinsnede op elke kaart, klein boven de cijfers. Ze zegt dat die cijfers gaan over waarvoor Youbo er gebruikt wordt, en niet over de grootte van het bedrijf. Houd het kort: tot ongeveer 20 tekens past het op één regel, ook op de smalste telefoon — langer wordt het twee regels.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'downloadtekst'
                label: 'Tekst op elke downloadlink'
                widget: 'string'
                required: true
                hint: 'Dezelfde tekst op elke downloadlink, op elke kaart.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'items'
                label: 'De cases'
                label_singular: 'case'
                widget: 'list'
                min: 2
                max: 7
                collapsed: true
                minimize_collapsed: true
                allow_reorder: true
                summary: '{{fields.bedrijf}} · {{fields.voordeel}}'
                hint: 'Minstens 2 en hoogstens 7. Het raster op desktop is zes kolommen: de bouw legt er zoveel rijen van drie kaarten in als kan en de rest in rijen van twee. Boven 7 steken de puntjes onder de rij op een telefoon buiten de pagina — gemeten.'
                fields:
                  - name: 'bedrijf'
                    label: 'Naam achter het logo'
                    widget: 'string'
                    required: true
                    hint: 'Wordt voorgelezen in plaats van het logo, en bepaalt het haakje waarmee de klik op de downloadlink geteld wordt. Hij staat niet als tekst op de pagina.'
                    pattern:
                      - '^[^<\n]*$'
                      - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
                  - name: 'logo'
                    label: 'Het logo op de kaart'
                    widget: 'image'
                    required: true
                    hint: 'Het logobestand. Een PNG of JPG wordt bij het uploaden zelf omgezet naar WebP en verkleind; een SVG wordt opgeschoond. Bestaat het bestand niet, dan stopt de publicatie.'
                    # Een logo op een kaart staat hoogstens op 32 beeldpunten hoog, dus is 96 drie keer zo veel — genoeg voor het scherpste scherm dat vandaag bestaat.
                    media_libraries:
                      default:
                        config:
                          transformations:
                            raster_image:
                              format: webp
                              quality: 82
                              width: 320
                              height: 96
                            svg:
                              optimize: true
                  - name: 'logo_hoogte'
                    label: 'Hoogte van het logo'
                    widget: 'number'
                    required: true
                    hint: 'De hoogte in beeldpunten waarop dit logo op de kaart staat. De logoplek is 32 hoog; de vijf van vandaag staan op 20, 21, 32, 24 en 24. Kijk in het voorbeeld naar de buren en kies wat even zwaar weegt.'
                    value_type: 'int'
                    min: 16
                    max: 32
                  - name: 'voordeel'
                    label: 'Het voordeel, groot op de kaart'
                    widget: 'string'
                    required: true
                    hint: 'De kop van de kaart. Kort: er is plaats voor ongeveer twee regels.'
                    pattern:
                      - '^[^<\n]*$'
                      - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
                  - name: 'cijfers'
                    label: 'De cijfers'
                    label_singular: 'cijfer'
                    widget: 'list'
                    min: 1
                    max: 3
                    hint: 'Eén regel per cijfer, twee of drie regels. Bijvoorbeeld "204 medewerkers". Meer dan drie maakt de kaarten ongelijk hoog.'
                    field:
                      name: 'cijfer'
                      label: 'Cijfer'
                      widget: 'string'
                      required: true
                      hint: 'Eén regel. Het stipje ervoor zet de pagina zelf.'
                      pattern:
                        - '^[^<\n]*$'
                        - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
                  - name: 'sector'
                    label: 'De sector'
                    widget: 'string'
                    required: true
                    hint: 'Eén regel onder de cijfers.'
                    pattern:
                      - '^[^<\n]*$'
                      - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
                  - name: 'nota'
                    label: 'Open punt op deze kaart'
                    widget: 'string'
                    required: false
                    hint: 'Mag leeg blijven, en blijft dat meestal: dan staat er geen kader op de kaart. Vul je het in, begin dan met "TODO — " en zet een dubbele punt na wie het moet antwoorden.'
                    pattern:
                      - '^[^<\n]*$'
                      - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
                  - name: 'downloadlink'
                    label: 'Waar de downloadlink naartoe gaat'
                    widget: 'string'
                    required: true
                    hint: 'Een anker op de pagina (#cases-open) of een bestand in deze repo. Verwijst het naar een bestand dat er niet is, dan stopt de publicatie.'
                    pattern:
                      - '^[^<\n]*$'
                      - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'nota'
                label: 'Open punt onder de cases'
                widget: 'string'
                required: true
                hint: 'Een open punt. Begin met "TODO — " en zet een dubbele punt na wie het moet antwoorden; dan krijgt het op de pagina het kader met de stippellijn. Haal het weg zodra het antwoord er is.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
          - name: 'quotes'
            label: 'De quotes'
            widget: 'object'
            collapsed: true
            fields:
              - name: 'kop'
                label: 'Kop boven de quotes'
                widget: 'string'
                required: true
                hint: 'Eén doorlopend stuk tekst. Geen HTML, geen nieuwe regel.'
                pattern:
                  - '^[^<\n]*$'
                  - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
              - name: 'items'
                label: 'De quotes'
                label_singular: 'quote'
                widget: 'list'
                min: 3
                max: 7
                collapsed: true
                minimize_collapsed: true
                allow_reorder: true
                summary: '{{fields.naam}} · {{fields.bedrijf}}'
                hint: 'Minstens 3 en hoogstens 7. Met twee is de rij op desktop niet meer schuifbaar: dan verdwijnt het halve derde kaartje dat zegt dat er nog volgen, en doen de pijlen en de puntjes niets. Boven 7 steken de puntjes buiten de pagina. Allebei gemeten.'
                fields:
                  - name: 'bedrijf'
                    label: 'Naam achter het logo'
                    widget: 'string'
                    required: true
                    hint: 'Wordt voorgelezen in plaats van het logo. Hij staat niet als tekst op de pagina — de functieregel noemt alleen de functie, anders hoort een schermlezer de klantnaam twee keer.'
                    pattern:
                      - '^[^<\n]*$'
                      - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
                  - name: 'logo'
                    label: 'Het logo op de kaart'
                    widget: 'image'
                    required: true
                    hint: 'Het logobestand. Een PNG of JPG wordt bij het uploaden zelf omgezet naar WebP en verkleind; een SVG wordt opgeschoond. Bestaat het bestand niet, dan stopt de publicatie. Let op: deze kaart staat op een donkere band, dus hoort hier de witte of de kleurversie van het logo en niet de donkere.'
                    # Een logo op een kaart staat hoogstens op 32 beeldpunten hoog, dus is 96 drie keer zo veel — genoeg voor het scherpste scherm dat vandaag bestaat.
                    media_libraries:
                      default:
                        config:
                          transformations:
                            raster_image:
                              format: webp
                              quality: 82
                              width: 320
                              height: 96
                            svg:
                              optimize: true
                  - name: 'logo_hoogte'
                    label: 'Hoogte van het logo'
                    widget: 'number'
                    required: true
                    hint: 'De hoogte in beeldpunten waarop dit logo op de donkere kaart staat. Een maat kleiner dan op een casekaart; de vijf van vandaag staan op 20, 16, 20, 20 en 17.'
                    value_type: 'int'
                    min: 14
                    max: 20
                  - name: 'tekst'
                    label: 'De quote'
                    widget: 'string'
                    required: true
                    hint: 'Eén doorlopend stuk tekst, met de aanhalingstekens erbij zoals ze er nu staan.'
                    pattern:
                      - '^[^<\n]*$'
                      - 'Gewone tekst, anders bouwt de pagina niet: geen < en geen nieuwe regel.'
                  - name: 'foto'
                    label: 'Het portret'
                    widget: 'image'
                    required: true
                    hint: 'Het portret naast de naam. Het staat in een cirkel van vaste maat met object-cover, dus past elke verhouding. Een PNG of JPG wordt bij het uploaden omgezet naar WebP en verkleind. Bestaat het bestand niet, dan stopt de publicatie.'
                    # Het portret staat op 56 beeldpunten (gemeten), dus is 168 drie keer zo veel. De portretten die de klant aanleverde zijn 320x320; die worden hier dus kleiner.
                    media_libraries:
                      default:
                        config:
                          transformations:
                            raster_image:
                              format: webp
                              quality: 82
                              width: 168
                              height: 168
                            svg:
                              optimize: true
                  - name: 'naam'
                    label: 'De naam onder de quote'
