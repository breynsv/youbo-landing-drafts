<!-- Het volledige logo van Aertssen Group: hun woordmerk én hun beeldmerk, in
     hun eigen vectorpaden uit het navigatielogo op aertssen.be, opgehaald op
     2026-10-21. Geen nagebouwde letter en geen nagetekend merk.

     DE GELE VORM ZIT ER NIET IN. Hun lockup staat op een geel parallellogram;
     op onze logobalk en casekaarten zou dat het enige gekleurde vlak van de rij
     zijn. Het beeldmerk houdt wel zijn eigen geel, want dat ís het merk.

     HET BEELDMERK STAAT 36 EENHEDEN DICHTER BIJ HET WOORD dan in hun bestand.
     Daar vult het gele vlak de ruimte ertussen; zonder dat vlak viel er een gat
     dat het logo in twee losse dingen deed uiteenvallen. -->
